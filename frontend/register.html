<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Lagos Night Sky</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dfe3e6;
            color: #fff;
        }

        .app {
            max-width: 900px;
            margin: 0 auto;
            min-height: 100vh;
            background: #121212;
            padding: 20px 20px 90px;
        }

        .top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top a {
            background: #222;
            color: #fff;
            text-decoration: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .card {
            background: #000;
            border-radius: 24px;
            padding: 22px;
            max-width: 420px;
            margin: 30px auto;
        }

        .card h1 {
            margin: 4px 0;
            font-size: 22px;
        }

        .subtitle {
            color: #aaa;
            font-size: 14px;
            margin: 0 0 14px;
        }

        .form-group {
            margin: 14px 0;
        }

        .form-group label {
            display: block;
            color: #aaa;
            font-size: 13px;
            margin-bottom: 6px;
        }

        .input-wrap {
            display: flex;
            align-items: center;
            background: #222;
            border-radius: 14px;
            padding: 0 12px;
        }

        .input-wrap .icon {
            font-size: 16px;
        }

        .input-wrap input {
            flex: 1;
            background: none;
            border: none;
            color: #fff;
            font-size: 15px;
            padding: 13px 8px;
        }

        .input-wrap input:focus {
            outline: none;
        }

        .card button {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 14px;
            padding: 13px;
            width: 100%;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }

        .error {
            color: #ff8080;
            text-align: center;
            font-size: 14px;
        }

        .link {
            text-align: center;
            font-size: 14px;
            color: #aaa;
        }

        .link a {
            color: #fff;
        }

        .nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 860px;
            max-width: calc(100% - 28px);
            background: #222;
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 12px;
        }

        .nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 22px;
        }

        .nav a.active {
            color: #fff;
        }

        @media (min-width: 500px) {
            body {
                padding: 20px 0;
            }

            .app {
                border-radius: 36px;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="top">
            <a href="index.html">←</a>
            <h1>Register</h1>
        </div>
        <div class="card">
            <h1>Create account</h1>
            <p class="subtitle">Sign up to save your favourite cities...</p>
            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <div class="input-wrap">
                        <span class="icon">👤</span>
                        <input type="text" id="name" placeholder="Enter your full name">
                    </div>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <span class="icon">✉</span>
                        <input type="email" id="email" placeholder="Enter your email">
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <span class="icon">🔒</span>
                        <input type="password" id="password" placeholder="Enter your password">
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrap">
                        <span class="icon">🔒</span>
                        <input type="password" id="confirmPassword" placeholder="Confirm your password">
                    </div>
                </div>
                <p class="error" id="registerMsg"></p>
                <button type="submit">Create Account</button>
            </form>
            <p class="link">Already have an account? <a href="login.html">Login</a></p>
        </div>
        <div class="nav">
            <a href="index.html">🏠</a>
            <a href="search.html">🔍</a>
            <a href="index.html">📋</a>
            <a class="active" href="login.html">👤</a>
        </div>
    </div>
    <script>
        document.getElementById("registerForm").addEventListener("submit", function (e) {
            e.preventDefault();
            var name = document.getElementById("name").value.trim();
            var email = document.getElementById("email").value.trim();
            var password = document.getElementById("password").value;
            var confirm = document.getElementById("confirmPassword").value;
            if (!name || !email || !password || !confirm) {
                document.getElementById("registerMsg").textContent = "Fill in all the fields.";
                return;
            }
            if (password !== confirm) {
                document.getElementById("registerMsg").textContent = "Passwords do not match.";
                return;
            }
            fetch("https://weather-app-project-3nny.onrender.com/api/auth/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: name, email: email, password: password })
            })
                .then(function (res) {
                    return res.json().then(function (data) {
                        return { ok: res.ok, data: data };
                    });
                })
                .then(function (result) {
                    if (!result.ok) {
                        document.getElementById("registerMsg").textContent = result.data.message;
                        return;
                    }
                    document.getElementById("registerMsg").textContent = "Account created. Now go to Login.";
                    window.location.href = "login.html";
                })
                .catch(function () {
                    document.getElementById("registerMsg").textContent = "Cannot reach the server. Is the backend still running on port 4000?";
                });
        });
    </script>

</body>

</html>
