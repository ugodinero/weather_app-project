<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City Search & Saved Locations</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dfe3e6;
            color: #fff;
        }

        .app {
            max-width: 900px;
            margin: 0 auto;
            min-height: 100vh;
            background: #121212;
            padding: 20px 20px 90px;
        }

        .top {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .top a {
            background: #222;
            color: #fff;
            text-decoration: none;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        h1 {
            font-size: 22px;
            margin: 18px 0 4px;
        }

        p {
            color: #aaa;
            font-size: 14px;
            margin: 0 0 14px;
        }

        .search {
            display: flex;
            gap: 8px;
            margin: 14px 0;
        }

        .search input {
            flex: 1;
            padding: 13px;
            border-radius: 14px;
            border: none;
            background: #222;
            color: #fff;
            font-size: 15px;
        }

        .search button {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 14px;
            padding: 0 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .result {
            background: #000;
            border-radius: 20px;
            padding: 18px;
            margin: 12px 0;
            display: none;
        }

        .result h2 {
            margin: 4px 0;
        }

        .result .temp {
            font-size: 48px;
            font-weight: bold;
        }

        .result button {
            background: #fff;
            color: #000;
            border: none;
            border-radius: 12px;
            padding: 10px 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .saved {
            background: #222;
            border-radius: 18px;
            padding: 14px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: none;
            width: 100%;
            color: #fff;
            text-align: left;
        }

        .saved b {
            display: block;
            font-size: 16px;
        }

        .saved span {
            color: #aaa;
            font-size: 13px;
        }

        .saved .temp {
            font-size: 28px;
            font-weight: bold;
        }

        .saved .remove {
            background: none;
            border: none;
            color: #ff8080;
            font-size: 18px;
            cursor: pointer;
        }

        .error {
            color: #ff8080;
            text-align: center;
        }

        .nav {
            position: fixed;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            width: 860px;
            max-width: calc(100% - 28px);
            background: #222;
            border-radius: 20px;
            display: flex;
            justify-content: space-around;
            padding: 12px;
        }

        .nav a {
            color: #aaa;
            text-decoration: none;
            font-size: 22px;
        }

        .nav a.active {
            color: #fff;
        }

        @media (min-width: 500px) {
            body {
                padding: 20px 0;
            }

            .app {
                border-radius: 36px;
            }
        }

        @media (min-width: 700px) {
            #savedList {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .saved {
                margin: 0;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <div class="top">
            <a href="index.html">←</a>
            <h1>City Search</h1>
        </div>
        <p>Search a city, then save it to your list.</p>
        <form class="search" id="searchForm">
            <input type="text" id="searchInput" placeholder="Search location...">
            <button type="submit">Go</button>
        </form>
        <p class="error" id="errorText"></p>
        <div class="result" id="result">
            <span id="resultIcon">☀️</span>
            <h2 id="resultName">Abuja</h2>
            <span id="resultCountry">Nigeria</span>
            <div class="temp"><span id="resultTemp">--</span>°</div>
            <p id="resultCondition">Clear Sky</p>
            <button id="saveBtn">+ Save Location</button>
        </div>
        <h1>Saved Locations</h1>
        <div id="savedList"></div>
        <div class="nav">
            <a href="index.html">🏠</a>
            <a class="active" href="search.html">🔍</a>
            <a href="index.html">📋</a>
            <a href="login.html">👤</a>
        </div>
    </div>
    <script>
        var saved = JSON.parse(localStorage.getItem("savedCities") || '["Abuja", "Lagos", "London"]');
        var found = null;
        function weatherText(code) {
            if (code === 0) return "Clear Sky";
            if (code === 1 || code === 2) return "Partly Cloudy";
            if (code === 3) return "Cloudy";
            if (code === 45 || code === 48) return "Foggy";
            if (code >= 51 && code <= 55) return "Drizzle";
            if (code >= 61 && code <= 65) return "Rain";
            if (code >= 80 && code <= 82) return "Rain Showers";
            if (code >= 95) return "Thunderstorm";
            return "Cloudy";
        }
        function weatherIcon(code) {
            if (code === 0) return "☀️";
            if (code === 1 || code === 2) return "⛅";
            if (code === 3) return "☁️";
            if (code >= 51 && code <= 65) return "🌧️";
            if (code >= 80 && code <= 82) return "🌦️";
            if (code >= 95) return "⛈️";
            return "☁️";
        }
        function showSaved() {
            var list = document.getElementById("savedList");
            list.innerHTML = "";
            if (saved.length === 0) {
                list.innerHTML = "<p>No saved locations yet. Search a city above.</p>";
                return;
            }
            saved.forEach(function (name, i) {
                var row = document.createElement("div");
                row.className = "saved";
                row.innerHTML = '<div><b>' + name + '</b><span class="cond">Loading...</span></div><div><span class="temp">--°</span> <button class="remove" title="Remove">×</button></div>';
                row.onclick = function () { searchCity(name); };
                row.querySelector(".remove").onclick = function (e) {
                    e.stopPropagation();
                    saved.splice(i, 1);
                    localStorage.setItem("savedCities", JSON.stringify(saved));
                    showSaved();
                };
                list.appendChild(row);
                fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + name + "&count=1&language=en&format=json")
                    .then(function (res) { return res.json(); })
                    .then(function (data) {
                        if (!data.results) return;
                        var p = data.results[0];
                        return fetch("https://api.open-meteo.com/v1/forecast?latitude=" + p.latitude + "&longitude=" + p.longitude + "&current=temperature_2m,weather_code&timezone=auto");
                    })
                    .then(function (res) { return res ? res.json() : null; })
                    .then(function (data) {
                        if (!data) return;
                        row.querySelector(".temp").textContent = Math.round(data.current.temperature_2m) + "°";
                        row.querySelector(".cond").textContent = weatherIcon(data.current.weather_code) + " " + weatherText(data.current.weather_code);
                    });
            });
        }
        function searchCity(name) {
            document.getElementById("errorText").textContent = "";
            fetch("https://geocoding-api.open-meteo.com/v1/search?name=" + name + "&count=1&language=en&format=json")
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    if (!data.results || data.results.length === 0) {
                        document.getElementById("errorText").textContent = "City not found. Try another city.";
                        return;
                    }
                    var p = data.results[0];
                    found = p;
                    return fetch("https://api.open-meteo.com/v1/forecast?latitude=" + p.latitude + "&longitude=" + p.longitude + "&current=temperature_2m,weather_code&timezone=auto");
                })
                .then(function (res) { return res ? res.json() : null; })
                .then(function (data) {
                    if (!data || !found) return;
                    document.getElementById("result").style.display = "block";
                    document.getElementById("resultName").textContent = found.name;
                    document.getElementById("resultCountry").textContent = found.country || "";
                    document.getElementById("resultTemp").textContent = Math.round(data.current.temperature_2m);
                    document.getElementById("resultCondition").textContent = weatherText(data.current.weather_code);
                    document.getElementById("resultIcon").textContent = weatherIcon(data.current.weather_code);
                    document.getElementById("saveBtn").textContent = saved.includes(found.name) ? "✓ Saved" : "+ Save Location";
                });
        }
        document.getElementById("searchForm").addEventListener("submit", function (e) {
            e.preventDefault();
            var name = document.getElementById("searchInput").value.trim();
            if (name) searchCity(name);
        });
        document.getElementById("saveBtn").addEventListener("click", function () {
            if (!found) return;
            if (!saved.includes(found.name)) {
                saved.push(found.name);
                localStorage.setItem("savedCities", JSON.stringify(saved));
                showSaved();
            }
            this.textContent = "✓ Saved";
        });
        showSaved();
    </script>
</body>

</html>
